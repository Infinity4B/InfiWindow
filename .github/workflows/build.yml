# Tests and builds InfiWindow for every Mac: Apple silicon (arm64), Intel
# (amd64) and a universal app that runs on both. InfiWindow is macOS-only
# (CGVirtualDisplay, nettop), so there are no Windows or Linux builds.
#
# - Pushes and pull requests: the disk images are kept as artifacts of the run.
# - Tags v*: also published as a GitHub release. The tag must match "version"
#   in mygo.json, e.g. bump it to 0.2.0, commit, then
#     git tag v0.2.0 && git push origin v0.2.0
#
# Hosted macOS runners are scarce: jobs that wait too long for one are
# cancelled ("The job was not acquired by Runner of type hosted"). So tests
# and all three builds share a single macOS job, and each run asks for only
# one macOS runner. Disk images need hdiutil, so the builds cannot move to
# Linux.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # MyGo needs no cgo, and its build turns it off anyway.
  CGO_ENABLED: "0"

jobs:
  build:
    name: Test and build (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag matches mygo.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mygo.json version $version"
            exit 1
          fi
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt on: $unformatted"
            exit 1
          fi
      - name: go vet
        run: |
          go vet ./...
          go vet -tags manual ./...
      - name: go test
        run: go test ./...
      - name: Build InfiWindow.app and the disk images
        run: go tool mygo build -platform darwin/arm64,darwin/amd64,darwin/universal
      - name: Name the artifacts
        run: |
          version="$(jq -r .version mygo.json)"
          for arch in arm64 amd64 universal; do
            dir="build/darwin-$arch"
            mkdir -p "dist/$arch"
            # mygo names the universal image without an arch; name all three
            # alike so the release lists them clearly.
            cp "$dir"/*.dmg "dist/$arch/InfiWindow-$version-macOS-$arch.dmg"
            ditto -c -k --keepParent "$dir/InfiWindow.app" "dist/$arch/InfiWindow-$version-macOS-$arch.zip"
          done
          ls -lhR dist
      - uses: actions/upload-artifact@v7
        with:
          name: InfiWindow-macOS-arm64
          path: dist/arm64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: InfiWindow-macOS-amd64
          path: dist/amd64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: InfiWindow-macOS-universal
          path: dist/universal/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          cat > notes.md <<'EOF'
          | 下载 | 适用于 |
          |---|---|
          | `*-macOS-arm64.dmg` | Apple 芯片（M1 及以后） |
          | `*-macOS-amd64.dmg` | Intel 芯片 |
          | `*-macOS-universal.dmg` | 两者通用（体积更大） |

          需要 macOS 12 及以上。应用为 ad-hoc 签名，首次打开如被拦截，请在“系统设置 → 隐私与安全性”中点击“仍要打开”，或执行 `xattr -dr com.apple.quarantine /Applications/InfiWindow.app`。
          EOF
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "InfiWindow $GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag "${flags[@]}"
          fi
